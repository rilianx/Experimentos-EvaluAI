name: Experimentos

# Se ejecuta al modificar experiments/run-request.json en un push, o manualmente desde la pestaña Actions.
# Secrets requeridos: OPENAI_API_KEY y DATASET_PASSPHRASE (contraseña de los archivos data/*.gpg).
on:
  push:
    paths:
      - experiments/run-request.json
  workflow_dispatch:
    inputs:
      suite:
        description: Archivo de la suite
        default: experiments/datastructures.json
      only:
        description: Experimentos separados por coma (vacío = todos)
        default: ''
      smoke:
        description: Corrida mínima de prueba
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer parámetros
        id: params
        env:
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          python - <<'PY'
          import json, os
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              req = {'suite': os.environ['INPUT_SUITE'], 'only': os.environ['INPUT_ONLY'], 'smoke': os.environ['INPUT_SMOKE'] == 'true'}
          else:
              req = json.load(open('experiments/run-request.json'))
          args = [req['suite']]
          if req.get('only'): args += ['--only', req['only']]
          if req.get('smoke', True): args += ['--smoke']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"args={' '.join(args)}\n")
          print('Parámetros:', args)
          PY

      - name: Descifrar datasets
        env:
          DATASET_PASSPHRASE: ${{ secrets.DATASET_PASSPHRASE }}
        run: |
          shopt -s nullglob
          files=(data/*.gpg)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No hay archivos data/*.gpg"; exit 1; fi
          for f in "${files[@]}"; do
            gpg --quiet --batch --yes --pinentry-mode loopback --passphrase "$DATASET_PASSPHRASE" --output "${f%.gpg}" --decrypt "$f"
          done

      # La salida completa va a run.log (cifrado), porque los logs de un repo público son visibles para cualquiera
      # y las respuestas del modelo pueden citar respuestas de estudiantes.
      - name: Ejecutar suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python run_suite.py ${{ steps.params.outputs.args }} > run.log 2>&1
          status=$?
          grep -E "^===== " run.log || true
          if [ $status -ne 0 ]; then echo "::error::La suite falló (código $status)"; tail -n 25 run.log | grep -E "Error|Traceback|File \"" ; fi
          exit $status

      - name: Mostrar resumen
        if: success()
        run: |
          for f in results/*/summary.md; do echo "## $f"; cat "$f"; done >> "$GITHUB_STEP_SUMMARY"
          cat results/*/summary.md
          cat results/*/comparisons.csv 2>/dev/null || true
          cat results/*/stability.csv 2>/dev/null || true

      - name: Cifrar salidas completas
        if: always()
        env:
          DATASET_PASSPHRASE: ${{ secrets.DATASET_PASSPHRASE }}
        run: |
          tar czf runs.tar.gz runs run.log 2>/dev/null || tar czf runs.tar.gz run.log
          gpg --batch --yes --pinentry-mode loopback --passphrase "$DATASET_PASSPHRASE" --symmetric --cipher-algo AES256 --output runs.tar.gz.gpg runs.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-encrypted-${{ github.run_id }}
          path: runs.tar.gz.gpg
          retention-days: 30

      - name: Guardar métricas agregadas en la rama
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "Sin cambios en results/"; exit 0; fi
          git commit -m "Resultados de ${{ steps.params.outputs.args }} (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
