name: Experimentos

# Se ejecuta al modificar experiments/run-request.json en un push, o manualmente desde la pestaña Actions.
# Secret requerido: OPENAI_API_KEY.
on:
  push:
    paths:
      - experiments/run-request.json
  workflow_dispatch:
    inputs:
      suite:
        description: Archivo de la suite
        default: experiments/datastructures.json
      only:
        description: Experimentos separados por coma (vacío = todos)
        default: ''
      smoke:
        description: Corrida mínima de prueba
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer parámetros
        id: params
        env:
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_ONLY: ${{ inputs.only }}
          INPUT_SMOKE: ${{ inputs.smoke }}
        run: |
          python - <<'PY'
          import json, os
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              req = {'suite': os.environ['INPUT_SUITE'], 'only': os.environ['INPUT_ONLY'], 'smoke': os.environ['INPUT_SMOKE'] == 'true'}
          else:
              req = json.load(open('experiments/run-request.json'))
          suites = req['suite'] if isinstance(req['suite'], list) else [req['suite']]
          cmds = []
          for suite in suites:
              args = [suite]
              if req.get('only'): args += ['--only', req['only']]
              if req.get('smoke', True): args += ['--smoke']
              cmds.append(' '.join(args))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('cmds<<EOF\n' + '\n'.join(cmds) + '\nEOF\n')
          print('Suites:', cmds)
          PY

      - name: Ejecutar suites
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CMDS: ${{ steps.params.outputs.cmds }}
        run: |
          set -o pipefail
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::run_suite.py $cmd"
            python run_suite.py $cmd 2>&1 | tee -a run.log
            echo "::endgroup::"
          done <<< "$CMDS"

      - name: Mostrar resumen
        if: success()
        run: |
          for f in results/*/summary.md; do echo "## $f"; cat "$f"; echo; done >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runs-${{ github.run_id }}
          path: |
            runs
            run.log
          retention-days: 90

      - name: Guardar métricas agregadas en la rama
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "Sin cambios en results/"; exit 0; fi
          git commit -m "Resultados de experimentos (run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
